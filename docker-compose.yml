services:
  web:
    build: .
    container_name: lagersystem-web
    ports:
      - "${WEB_PORT:-5050}:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lager}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lager}
      - SECRET_KEY=${SECRET_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-1}
      - TZ=${TZ:-Europe/Berlin}
      - UPLOAD_DIR=/app/data/uploads
      - BACKUP_DIR=/backup
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      - SKVE_API_KEY=${SKVE_API_KEY:-}
      - SKVE_GAS_STORAGE_ID=${SKVE_GAS_STORAGE_ID:-}
    volumes:
      - uploads:/app/data
      # Datensicherung – zum Umstellen auf ein NAS siehe README („Datensicherung“)
      - ${BACKUP_PATH:-backups}:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Hühnerstall-Sensor (Meshtastic) – nur mit COMPOSE_PROFILES=huehner, siehe bridge/README.md ---
  mqtt:
    build: ./bridge/mosquitto
    container_name: lagersystem-mqtt
    profiles: ["huehner"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
    restart: unless-stopped

  coop-bridge:
    build: ./bridge
    container_name: lagersystem-coop-bridge
    profiles: ["huehner"]
    environment:
      - APP_URL=http://web:5000/api/huehner/sensor
      - COOP_API_TOKEN=${COOP_API_TOKEN:-}
      - MQTT_HOST=mqtt
      - MQTT_TOPIC=${MESHTASTIC_TOPIC:-msh/#}
      - COOP_NODE=${COOP_NODE:-}
      - DOOR_NAME=${COOP_DOOR_NAME:-Klappe}
      - DOOR_ACTIVE=${COOP_DOOR_ACTIVE:-open}
      - DEBUG=${COOP_DEBUG:-}
      - TZ=${TZ:-Europe/Berlin}
    depends_on:
      - mqtt
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: lagersystem-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lager}
      POSTGRES_USER: ${POSTGRES_USER:-lager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lager} -d ${POSTGRES_DB:-lager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads:
  backups:
